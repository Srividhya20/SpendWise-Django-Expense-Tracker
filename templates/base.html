
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SpendWise{% endblock %}</title>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --background: #f5f7fc;
            --text: #172033;
            --muted: #64748b;
            --border: #e2e8f0;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--text);
            line-height: 1.5;
        }

        /* Navigation */
        nav {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 6%;
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav strong {
            font-size: 25px;
            color: var(--primary);
            margin-right: auto;
        }

        nav a {
            color: var(--text);
            font-weight: 600;
            text-decoration: none;
        }

        nav a:hover {
            color: var(--primary);
        }

        nav form {
            margin: 0;
        }

        /* Main content */
        main {
            max-width: 1200px;
            width: 100%;
            margin: 35px auto;
            padding: 0 20px;
            min-height: 75vh;
        }

        /* Cards */
        .card, .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.03);
        }

        h1 {
            font-size: 30px;
            margin: 0 0 10px;
        }

        h2 {
            font-size: 21px;
            margin-top: 0;
        }

        .muted {
            color: var(--muted);
        }

        /* Grids */
        .grid, .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
        }

        .stat {
            font-size: 27px;
            font-weight: 700;
            margin-top: 10px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: 700;
            margin-top: 10px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 14px;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 9px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
            color: white;
        }

        .btn.secondary {
            background: #edf1ff;
            color: var(--primary);
        }

        .btn.danger {
            background: #dc4444;
            color: white;
        }

        /* Forms */
        input, select, textarea {
            max-width: 100%;
            font: inherit;
        }

        input:not([type="checkbox"]),
        select,
        textarea,
        .field,
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            margin: 6px 0 15px;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }

        label {
            font-weight: 600;
        }

        form p {
            margin-bottom: 14px;
        }

        ul.errorlist {
            color: #dc2626;
        }

        /* Tables */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 13px 10px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--muted);
            font-size: 13px;
        }

        /* Messages */
        .messages {
            padding: 0;
            list-style: none;
        }

        .messages li {
            background: #e9f8ef;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        /* Progress bars */
        .bar, .progress-track {
            height: 10px;
            background: #edf0f6;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar span, .progress-fill {
            display: block;
            height: 100%;
            background: var(--primary);
            border-radius: 20px;
        }

        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Authentication */
        .auth-card {
            max-width: 460px;
            margin: 50px auto;
            padding: 30px;
        }

        .auth-card label {
            display: block;
            margin-bottom: 6px;
        }

        .auth-card .btn {
            width: 100%;
        }

        .auth-card .helptext {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
        }

        /* Mobile responsive */
        @media (max-width: 700px) {

            nav {
                padding: 15px 5%;
                gap: 14px;
            }

            nav strong {
                width: 100%;
                font-size: 23px;
            }

            nav a {
                font-size: 13px;
            }

            main {
                margin: 22px auto;
                padding: 0 14px;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 18px;
            }

            .card, .stat-card {
                padding: 18px;
            }

            .stats-grid, .grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-value, .stat {
                font-size: 21px;
            }

            .auth-card {
                margin: 20px auto;
                padding: 22px;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 550px;
            }

            .btn {
                padding: 10px 13px;
            }
        }

        @media (max-width: 380px) {
            .stats-grid, .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>
    <strong>SpendWise</strong>

    {% if user.is_authenticated %}

        <a href="{% url 'dashboard' %}">Dashboard</a>

        <a href="{% url 'expense_list' %}">Expenses</a>

        <a href="{% url 'budget_set' %}">Monthly Budget</a>

        <a href="{% url 'expense_reports' %}">Reports</a>

        <a href="{% url 'profile' %}">Profile</a>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn secondary">
                Logout
            </button>
        </form>

    {% else %}

        <a href="{% url 'login' %}">Login</a>

        <a href="{% url 'register' %}">Register</a>

    {% endif %}
</nav>

<main>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
